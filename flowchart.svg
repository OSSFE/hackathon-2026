<svg xmlns="http://www.w3.org/2000/svg" width="920" height="900" viewBox="0 0 920 900" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d98a00"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="900" fill="#ffffff"/>

  <text x="30" y="38" font-size="20" font-weight="600" fill="#1a1a1a">OpenMC to FEniCS coupling</text>
  <text x="30" y="60" font-size="13" fill="#5f6368">Neutron transport and thermal simulation, exchanging an unstructured mesh as VTKHDF</text>

  <!-- ================= script 1 lane ================= -->
  <rect x="24" y="80" width="872" height="456" rx="8" fill="#f7fafd" stroke="#c9d9ec" stroke-width="1"/>
  <text x="40" y="102" font-size="12" font-weight="600" fill="#3d6f9e">1-make-cad-get-neutron-heating.py</text>

  <!-- CadQuery -->
  <rect x="56" y="114" width="440" height="64" rx="6" fill="#eef4fb" stroke="#4a7ebb" stroke-width="1.5"/>
  <text x="74" y="138" font-size="14" font-weight="600" fill="#1a1a1a">CadQuery</text>
  <text x="74" y="158" font-size="12" fill="#444444">Build the CAD assembly, a box with a sphere cut out of it</text>

  <!-- cad_to_dagmc -->
  <rect x="56" y="202" width="440" height="64" rx="6" fill="#eef4fb" stroke="#4a7ebb" stroke-width="1.5"/>
  <text x="74" y="226" font-size="14" font-weight="600" fill="#1a1a1a">cad_to_dagmc</text>
  <text x="74" y="246" font-size="12" fill="#444444">Mesh the CAD with gmsh, write the DAGMC geometry and mesh</text>

  <!-- files produced, consumed by OpenMC -->
  <rect x="56" y="290" width="440" height="64" rx="6" fill="#f2f2f2" stroke="#9aa0a6" stroke-width="1.3"/>
  <text x="74" y="314" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" fill="#1a1a1a">dagmc.h5m</text>
  <text x="180" y="314" font-size="12" fill="#444444">the neutronics geometry</text>
  <text x="74" y="338" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" fill="#1a1a1a">umesh.vtk</text>
  <text x="180" y="338" font-size="12" fill="#444444">the mesh the tally is scored on</text>

  <!-- side branch, the inspector -->
  <rect x="560" y="290" width="336" height="64" rx="6" fill="#eef4fb" stroke="#4a7ebb" stroke-width="1.5"/>
  <text x="578" y="313" font-size="13" font-weight="600" fill="#1a1a1a">dagmc_h5m_file_inspector</text>
  <text x="578" y="333" font-size="11.5" fill="#444444">Convert the h5m to <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">dagmc.vtkhdf</tspan></text>
  <text x="578" y="347" font-size="11.5" fill="#444444">so the geometry can be viewed</text>

  <!-- OpenMC -->
  <rect x="56" y="378" width="440" height="64" rx="6" fill="#eef4fb" stroke="#4a7ebb" stroke-width="1.5"/>
  <text x="74" y="402" font-size="14" font-weight="600" fill="#1a1a1a">OpenMC</text>
  <text x="74" y="422" font-size="12" fill="#444444">Transport 14 MeV neutrons, score the tally on that mesh</text>

  <!-- tally.vtkhdf, the handoff -->
  <rect x="56" y="466" width="440" height="56" rx="6" fill="#fff4e5" stroke="#d98a00" stroke-width="1.8"/>
  <text x="74" y="490" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" fill="#7a4f00">tally.vtkhdf</text>
  <text x="180" y="490" font-size="12" fill="#7a4f00">the unstructured mesh, with the</text>
  <text x="180" y="508" font-size="12" fill="#7a4f00">tally result attached as cell data</text>
  <text x="516" y="498" font-size="11" font-style="italic" fill="#7a4f00">the handoff between the two codes</text>

  <!-- ================= script 2 lane ================= -->
  <rect x="24" y="552" width="872" height="252" rx="8" fill="#f6fbf7" stroke="#c3e0cd" stroke-width="1"/>
  <text x="40" y="574" font-size="12" font-weight="600" fill="#3d7e58">2-solve-heat-equation.py</text>

  <rect x="56" y="586" width="440" height="64" rx="6" fill="#eef7f0" stroke="#4a9b6a" stroke-width="1.5"/>
  <text x="74" y="610" font-size="14" font-weight="600" fill="#1a1a1a">DOLFINx and h5py</text>
  <text x="74" y="630" font-size="12" fill="#444444">Read the mesh and the cell data from <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">tally.vtkhdf</tspan></text>

  <rect x="56" y="674" width="440" height="64" rx="6" fill="#eef7f0" stroke="#4a9b6a" stroke-width="1.5"/>
  <text x="74" y="698" font-size="14" font-weight="600" fill="#1a1a1a">DOLFINx</text>
  <text x="74" y="718" font-size="12" fill="#444444">Solve the transient heat equation, tally as the source term</text>

  <rect x="56" y="756" width="440" height="44" rx="6" fill="#f2f2f2" stroke="#9aa0a6" stroke-width="1.3"/>
  <text x="74" y="783" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1a1a1a">diffusion.xdmf</text>
  <text x="230" y="783" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1a1a1a">diffusion.vtkhdf</text>

  <!-- ParaView, optional -->
  <rect x="56" y="828" width="440" height="52" rx="6" fill="#fafafa" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="74" y="850" font-size="14" font-weight="600" fill="#444444">ParaView</text>
  <text x="74" y="869" font-size="12" fill="#5f6368">View the temperature field over time</text>

  <!-- ================= arrows down the main column ================= -->
  <line x1="276" y1="178" x2="276" y2="198" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="276" y1="266" x2="276" y2="286" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="276" y1="354" x2="276" y2="374" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="276" y1="442" x2="276" y2="462" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="276" y1="522" x2="276" y2="582" stroke="#d98a00" stroke-width="1.8" marker-end="url(#arrowOrange)"/>
  <line x1="276" y1="650" x2="276" y2="670" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="276" y1="738" x2="276" y2="752" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="276" y1="800" x2="276" y2="824" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- arrow labels making the produce and consume relationship explicit -->
  <text x="288" y="282" font-size="11" font-style="italic" fill="#5f6368">writes</text>
  <text x="288" y="370" font-size="11" font-style="italic" fill="#5f6368">both read by OpenMC</text>
  <text x="288" y="458" font-size="11" font-style="italic" fill="#5f6368">writes</text>
  <text x="288" y="746" font-size="11" font-style="italic" fill="#5f6368">writes</text>

  <!-- side branch arrow, h5m into the inspector -->
  <line x1="496" y1="322" x2="556" y2="322" stroke="#5f6368" stroke-width="1.4" marker-end="url(#arrow)"/>

</svg>
